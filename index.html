<script>
  document.querySelectorAll('.cell').forEach(cell => {
    let isAnimating = false;

    cell.addEventListener('mouseenter', () => {
      if (isAnimating) return;

      isAnimating = true;
      cell.style.transform = 'rotateY(360deg)';

      // После окончания анимации сбрасываем
      setTimeout(() => {
        cell.style.transition = 'none';          // убираем transition, чтобы мгновенно вернуть
        cell.style.transform = 'rotateY(0deg)';
        
        // Возвращаем transition обратно
        setTimeout(() => {
          cell.style.transition = 'transform 0.9s cubic-bezier(0.4, 0.0, 0.2, 1)';
          isAnimating = false;
        }, 20);
      }, 900); // время = длительности transition
    });
  });
</script>
  <script>
  document.getElementById('showAllBtn').addEventListener('click', function(e) {
    e.preventDefault();

    const cells = document.querySelectorAll('.cell');
    
    cells.forEach((cell, index) => {
      // Случайное направление разлёта
      const x = (Math.random() - 0.5) * 1200;
      const y = (Math.random() - 0.5) * 800;
      const rot = (Math.random() - 0.5) * 180;

      cell.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
      cell.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(0.3)`;
      cell.style.opacity = '0';
    });

    // Переход на all.html после анимации
    setTimeout(() => {
      window.location.href = 'all.html';
    }, 850);
  });
</script>
