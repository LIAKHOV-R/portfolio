<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #fcfcfc;
  }

  .bio-page {
    max-width: 1700px;
    margin: 0 auto;
    padding: 18px 50px 30px;     /* сильно уменьшили верхний отступ */
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 50px;
    color: #191919;
    min-height: 100vh;
  }

  .back-link {
    grid-column: 1 / -1;
    font-family: Corbel, "Segoe UI", Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #191919;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 12px;
  }
  .back-link:hover {
    opacity: 0.7;
  }

  .bio-left h1 {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 12px 0;
  }

  .bio-text {
    font-size: 14.5px;
    line-height: 1.4;
    margin: 0 0 9px 0;
    max-width: 100%;
  }

  .bio-list {
    list-style: none;
    margin: 6px 0 16px 0;
    padding: 0;
  }
  .bio-list li {
    font-size: 14.5px;
    line-height: 1.35;
    position: relative;
    padding-left: 14px;
    margin-bottom: 1px;
  }
  .bio-list li::before {
    content: "–";
    position: absolute;
    left: 0;
  }

  .skills-title {
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 18px 0 10px 0;
  }

  .skills-icons {
    width: 100%;
    max-width: 900px;          /* иконки стали шире */
  }

  .skills-icons img {
    width: 100%;
    height: auto;
    display: block;
  }

  .bio-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .photo-frame {
    width: 240px;
    height: 240px;
    background-color: #c4c4c4;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .contacts {
    font-size: 13.5px;
    line-height: 1.5;
    text-align: right;
  }
  .contacts p {
    margin: 0 0 2px 0;
  }

  @media (max-width: 1100px) {
    .bio-page {
      grid-template-columns: 1fr;
      padding: 20px 25px 40px;
      gap: 25px;
    }
    .bio-right {
      align-items: flex-start;
    }
  }
</style>
