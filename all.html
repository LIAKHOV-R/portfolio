  <title>All Projects — Liakhov Roman Architect</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      background: #fff;
      font-family: Corbel, "Segoe UI", Arial, sans-serif;
    }

    /* Закреплённая шапка */
    .all-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #fff;
      z-index: 100;
      text-align: center;
      padding: 25px 20px 20px;
      border-bottom: 1px solid #eee;
    }

    .all-header h1 {
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 6px;
      margin: 0;
      text-transform: uppercase;
    }

    .all-header .subtitle {
      font-size: 14px;
      letter-spacing: 3px;
      margin-top: 6px;
      color: #191919;
    }

    .back-to-grid {
      position: absolute;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #191919;
      text-decoration: none;
    }
    .back-to-grid:hover { opacity: 0.7; }

    /* Сетка всех изображений */
    .all-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;                    /* очень маленький зазор */
      padding-top: 120px;          /* отступ под фиксированную шапку */
      width: 100%;
    }

    .all-grid img {
      width: 100%;
      aspect-ratio: 8 / 3;         /* 1920×720 */
      object-fit: cover;
      display: block;
    }

    @media (max-width: 1200px) {
      .all-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .all-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .all-header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<script>
  const grid = document.querySelector('.all-grid');
  const images = Array.from(grid.children);

  // Перемешиваем массив
  for (let i = images.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [images[i], images[j]] = [images[j], images[i]];
  }

  // Очищаем сетку и вставляем в новом порядке
  grid.innerHTML = '';
  images.forEach(img => grid.appendChild(img));
</script>
