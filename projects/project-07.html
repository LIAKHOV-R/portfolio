<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПРОЕКТ 07</title>
  <link rel="stylesheet" href="../style.css">
  <style>
  .project-page {
    max-width: 1920px;
    margin: 0 auto;
    padding: 20px 70px 20px;     /* сильно уменьшили отступы */
    color: #191919;
    height: 100vh;               /* занимает всю высоту экрана */
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  .back-link {
  display: block;
  width: 650px;
  margin-left: 120px;
  margin-bottom: 10px;
  font-family: Corbel, "Segoe UI", Arial, sans-serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #191919;
  text-decoration: none;
}
.back-link:hover { opacity: 0.7; }

.project-header {
  display: grid;
  grid-template-columns: 650px 900px;
  gap: 100px;
  margin-left: 120px;
  margin-bottom: 18px;
  align-items: start;
  flex-shrink: 0;
}

.project-title {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
  .project-description {
    font-size: 14px;
    line-height: 1.45;
    max-width: 480px;
  }

  .project-side-text {
    font-size: 13px;
    line-height: 1.45;
    color: #333;
  }

    /* Большие кнопки переключения проектов — по краям на уровне шапки */
.project-nav {
  position: fixed;
  top: 60px;                    /* уровень шапки */
  width: 48px;
  height: 90px;
  background: rgba(240, 240, 240, 0.75);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: #191919;
  z-index: 100;
  transition: background 0.2s;
  text-decoration: none;
}

.project-nav:hover {
  background: rgba(255, 255, 255, 0.95);
}

.project-nav.prev-project {
  left: 0;
  border-radius: 0 6px 6px 0;
}

.project-nav.next-project {
  right: 0;
  border-radius: 6px 0 0 6px;
}
    
  /* Карусель занимает всё оставшееся место */
.carousel {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  aspect-ratio: 8 / 3;          /* жёстко 1920×720 */
  overflow: hidden;
  background: #c4c4c4;
  flex-shrink: 0;
}

.carousel-track {
  display: flex;
  height: 100%;
  transition: transform 0.4s ease;
}

.carousel-slide {
  min-width: 100%;
  height: 100%;
}

.carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    height: 42px;
    background: rgba(255,255,255,0.85);
    border: none;
    cursor: pointer;
    font-size: 20px;
    color: #191919;
    z-index: 10;
  }
  .carousel-btn.prev { left: 15px; }
  .carousel-btn.next { right: 15px; }

  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 12px;
    flex-shrink: 0;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff7fbf;
    cursor: pointer;
  }
  .dot.active {
    background: #191919;
  }

  @media (max-width: 1000px) {
    .project-page {
      height: auto;
      padding: 20px 30px;
    }
    .project-header {
      grid-template-columns: 1fr;
      gap: 15px;
    }
  }
</style>
</head>
<body>

  <div class="project-page">

    <a href="../index.html" class="back-link">BACK&lt;</a>

    <!-- ШАПКА + БОЛЬШИЕ КНОПКИ ПРОЕКТОВ -->
    <div class="project-header-wrapper">
      <!-- Кнопка предыдущего проекта -->
      <a href="project-06.html" class="project-nav prev-project" title="Предыдущий проект">‹</a>

      <div class="project-header">
        <div>
          <h1 class="project-title">ПРОЕКТ 07</h1>
          <div class="project-description">
          ЭСКИЗНЫЙ ПРОЕКТ. ШКОЛЬНЫЙ КОМПЛЕКС на 2200 мест<br>
          в Академическом районе г. Екатеринбург<br>
          - РАЗРАБОТКА ЭСКИЗНОГО 2025 Г.<br>
        </div>
      </div>

      <div class="project-side-text">
        ОПИСАНИЕ ПРОЕКТА. ТЕХНИКО-ЭКОНОМИЧЕСКИЕ ПОКАЗАТЕЛИ<br>
        ОПИСАНИЕ ПРОЕКТА. ТЕХНИКО-ЭКОНОМИЧЕСКИЕ ПОКАЗАТЕЛИ<br>
        ДОПОЛНИТЕЛЬНАЯ ИНФА<br>
      </div>
    </div>

    <!-- Кнопка следующего проекта -->
    <a href="project-08.html" class="project-nav next-project" title="Следующий проект">›</a>
    </div>
    
    <!-- КАРУСЕЛЬ -->
    <div class="carousel" id="carousel">
      <div class="carousel-track">
        <div class="carousel-slide">
          <img src="../images/school/schl-0.jpg" alt="Слайд 1">
        </div>
        <div class="carousel-slide">
          <img src="../images/school/schl-1.jpg" alt="Слайд 2">
        </div>
        <div class="carousel-slide">
          <img src="../images/school/schl-2.jpg" alt="Слайд 3">
        </div>
        <div class="carousel-slide">
          <img src="../images/school/schl-3.jpg" alt="Слайд 4">
        </div>
      </div>

      <button class="carousel-btn prev">‹</button>
      <button class="carousel-btn next">›</button>
    </div>

    <div class="carousel-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

  <script>
    // ===== Карусель картинок =====
    const track = document.querySelector('.carousel-track');
    const slides = Array.from(track.children);
    const nextBtn = document.querySelector('.carousel-btn.next');
    const prevBtn = document.querySelector('.carousel-btn.prev');
    const dots = document.querySelectorAll('.dot');
    const carousel = document.getElementById('carousel');

    let currentIndex = 0;

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
    }

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % slides.length;
      updateCarousel();
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      updateCarousel();
    });

    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => {
        currentIndex = i;
        updateCarousel();
      });
    });

    // Прокрутка колесиком мыши по карусели
    carousel.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY > 0) {
        currentIndex = (currentIndex + 1) % slides.length;
      } else {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      }
      updateCarousel();
    }, { passive: false });
  </script>

</body>
</html>
