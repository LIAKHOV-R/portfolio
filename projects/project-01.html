<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проект 01</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .project-page {
      max-width: 1660px;          /* 1920 - 130 - 130 */
      margin: 0 auto;
      padding: 50px 130px 80px;
      display: grid;
      grid-template-columns: 1fr 325px;
      gap: 120px;
      color: #191919;
      text-transform: none;       /* на этой странице обычный регистр */
    }

    /* Кнопка BACK */
    .back-link {
      grid-column: 1 / -1;
      font-family: Corbel, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #191919;
      text-decoration: none;
      margin-bottom: 15px;
      display: inline-block;
    }
    .back-link:hover {
      opacity: 0.7;
    }
    
    h1 {
      margin-bottom: 10px;
      position: relative;
      padding-left: 18px;
    }
    p {
      line-height: 1.6;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="project-page">
    <a href="../index.html" class="back-link">BACK&lt;</a>
    
    <h1>Проект 01</h1>
    <p>Здесь будет описание проекта, фотографии, чертежи и т.д.</p>
    <p>Пока это просто тестовая страница.</p>
  </div>
</body>
</html>
