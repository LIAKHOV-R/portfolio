<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПРОЕКТ 01</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .project-page {
      max-width: 1775px;
      margin: 0 auto;
      padding: 40px 70px 80px;
      color: #191919;
    }

    /* Кнопка BACK */
    .back-link {
      display: inline-block;
      font-family: Corbel, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #191919;
      text-decoration: none;
      margin-bottom: 25px;
    }
    .back-link:hover {
      opacity: 0.7;
    }

    /* Верхний блок: слева заголовок+описание, справа доп. текст */
    .project-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      margin-bottom: 40px;
      align-items: start;
    }

    .project-title {
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .project-description {
      font-size: 16px;
      line-height: 1.55;
      max-width: 520px;
    }

    .project-side-text {
      font-size: 15px;
      line-height: 1.55;
      color: #333;
    }

    /* Большой прямоугольный фрейм под картинку */
    .project-image {
      width: 100%;
      height: 655px;
      background-color: #c4c4c4;
      margin-bottom: 40px;
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 1000px) {
      .project-page {
        padding: 30px 30px 60px;
      }
      .project-header {
        grid-template-columns: 1fr;
        gap: 25px;
      }
      .project-image {
        height: 380px;
      }
    }
  </style>
</head>
<body>

  <div class="project-page">

    <a href="../index.html" class="back-link">BACK&lt;</a>

    <div class="project-header">
      <!-- Левая часть -->
      <div>
        <h1 class="project-title">ПРОЕКТ 01</h1>
        <div class="project-description">
          Здесь будет описание проекта, фотографии, чертежи и т.д.<br>
          Пока это просто тестовая страница.
        </div>
      </div>

      <!-- Правая часть (дополнительный текст) -->
      <div class="project-side-text">
        Здесь можно разместить дополнительное описание,<br>
        характеристики проекта, год, площадь и т.д.
      </div>
    </div>

    <!-- Большой фрейм под изображение -->
    <div class="project-image">
      <img src="../images/проект1.jpg" alt="Проект 01">
    </div>

  </div>

</body>
</html>
