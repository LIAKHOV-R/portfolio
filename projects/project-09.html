   <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПРОЕКТ 09</title>
  <link rel="stylesheet" href="../style.css">
  <style>
        body {
  background-color: #ff7fbf;
}
    .project-page {
      max-width: 1775px;
      margin: 0 auto;
      padding: 20px 70px 40px;
      color: #191919;
      position: relative;
    }

    /* ----- BACK ----- */
    .back-link {
      display: inline-block;
      font-family: Corbel, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #191919;
      text-decoration: none;
      margin-bottom: 18px;
    }
    .back-link:hover { opacity: 0.7; }

    /* ----- ШАПКА С НАВИГАЦИЕЙ ПО ПРОЕКТАМ ----- */
    .project-header-wrapper {
      position: relative;
      margin-bottom: 30px;
    }

    .project-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: start;
      padding: 0 70px; /* место под большие кнопки */
    }

    .project-title {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .project-description {
      font-size: 15px;
      line-height: 1.5;
    }

    .project-side-text {
      font-size: 14px;
      line-height: 1.5;
      color: #333;
    }

/* Большие кнопки переключения проектов — по краям на уровне шапки */
.project-nav {
  position: fixed;
  top: 80px;                    /* уровень шапки */
  width: 48px;
  height: 90px;
  background: rgba(240, 240, 240, 0.75);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: #191919;
  z-index: 100;
  transition: background 0.2s;
  text-decoration: none;
}

.project-nav:hover {
  background: rgba(255, 255, 255, 0.95);
}

.project-nav.prev-project {
  left: 0;
  border-radius: 0 6px 6px 0;
}

.project-nav.next-project {
  right: 0;
  border-radius: 6px 0 0 6px;
}

    /* ----- КАРУСЕЛЬ КАРТИНОК ----- */
    .carousel {
      position: relative;
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      overflow: hidden;
      background: #c4c4c4;
      height: 620px;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.45s ease;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.85);
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #191919;
      z-index: 10;
      border-radius: 4px;
    }
    .carousel-btn:hover { background: #fff; }
    .carousel-btn.prev { left: 18px; }
    .carousel-btn.next { right: 18px; }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
    }
    .dot.active { background: #191919; }

    @media (max-width: 1000px) {
      .project-page { padding: 20px 25px 40px; }
      .project-header { grid-template-columns: 1fr; padding: 0 50px; }
      .carousel { height: 380px; }
      .project-nav { width: 44px; font-size: 26px; }
    }
  </style>
</head>
<body>

  <div class="project-page">

    <a href="../index.html" class="back-link">BACK&lt;</a>

    <!-- ШАПКА + БОЛЬШИЕ КНОПКИ ПРОЕКТОВ -->
    <div class="project-header-wrapper">
      <!-- Кнопка предыдущего проекта -->
      <a href="project-08.html" class="project-nav prev-project" title="Предыдущий проект">‹</a>

      <div class="project-header">
        <div>
          <h1 class="project-title">ПРОЕКТ 09</h1>
          <div class="project-description">
ЭСКИЗНЫЙ ПРОЕКТ: КОМПЛЕКС СКЛАДСКИХ И ТОРГОВЫХ ЗДАНИЙ<br>
СВЕРДЛОВСКАЯ ОБЛАСТЬ<br>
- РАЗРАБОТКА ЭСКИЗНОГО ПРОЕКТА
          </div>
        </div>
        <div class="project-side-text">
ОБЩЕЕ ОПИСАНИЕ ПРОЕКТА, КОНЦЕПЦИЯ, И Т.Д.<br>
ДОПОЛНИТЕЛЬНЫЙ ТЕКСТ О ПРОЕКТЕ
        </div>
      </div>

      <!-- Кнопка следующего проекта -->
      <a href="project-10.html" class="project-nav next-project" title="Следующий проект">›</a>
    </div>

    <!-- КАРУСЕЛЬ КАРТИНОК -->
    <div class="carousel" id="carousel">
      <div class="carousel-track">
        <div class="carousel-slide">
          <img src="../images/next.jpg" alt="Слайд 1">
        </div>
        <div class="carousel-slide">
          <img src="../images/next.jpg" alt="Слайд 2">
        </div>
        <div class="carousel-slide">
          <img src="../images/next.jpg" alt="Слайд 3">
        </div>
      </div>

      <button class="carousel-btn prev">‹</button>
      <button class="carousel-btn next">›</button>
    </div>

    <div class="carousel-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

  <script>
    // ===== Карусель картинок =====
    const track = document.querySelector('.carousel-track');
    const slides = Array.from(track.children);
    const nextBtn = document.querySelector('.carousel-btn.next');
    const prevBtn = document.querySelector('.carousel-btn.prev');
    const dots = document.querySelectorAll('.dot');
    const carousel = document.getElementById('carousel');

    let currentIndex = 0;

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
    }

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % slides.length;
      updateCarousel();
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      updateCarousel();
    });

    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => {
        currentIndex = i;
        updateCarousel();
      });
    });

    // Прокрутка колесиком мыши по карусели
    carousel.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY > 0) {
        currentIndex = (currentIndex + 1) % slides.length;
      } else {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      }
      updateCarousel();
    }, { passive: false });
  </script>

</body>
</html>
